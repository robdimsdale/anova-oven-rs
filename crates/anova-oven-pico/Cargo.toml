# Standalone workspace — this crate targets thumbv6m-none-eabi (Cortex-M0+)
# and cannot share a workspace with host-target crates due to conflicting
# critical-section features. Build from this directory:
#   cargo build --release
#
# For development with verbose logging from cyw43/embassy-net/reqwless and
# per-event INFO logs from the encoder/heap tasks, add:
#   cargo build --release --features verbose-logs
[workspace]

[package]
  name = "anova-oven-pico"
  version = "0.1.0"
  edition = "2021"

[features]
  default = []
  # Enables defmt on chatty third-party deps and per-event INFO logs in our
  # own code. Off by default so the RTT buffer stays drainable when no probe
  # is attached. Warnings and errors are always emitted unconditionally.
  verbose-logs = [
    "cyw43/defmt",
    "cyw43-pio/defmt",
    "embassy-net/defmt",
    "reqwless/defmt",
  ]

[dependencies]
  # Main branch uses embedded-hal 1.0 but is not yet published to crates.io.
  hd44780-driver = { git = "https://github.com/JohnDoneth/hd44780-driver", branch = "master", features = [
    "async",
  ] }
  embedded-hal = "1"

  anova-oven-api = { path = "../anova-oven-api", default-features = false }
  serde_json = { version = "1.0", default-features = false, features = [
    "alloc",
  ] }

  embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
  ] }
  embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "time-driver",
    "critical-section-impl",
    "rp2040",
  ] }
  embassy-net = { version = "0.9.0", default-features = false, features = [
    "tcp",
    "dhcpv4",
    "dns",
    "medium-ethernet",
    "proto-ipv4",
  ] }
  embassy-futures = "0.1"
  embassy-sync = "0.8"
  embassy-time = "0.5"

  embedded-alloc = "0.7"
  embedded-io-async = "0.7"
  heapless = { version = "0.9", default-features = false }

  # Plain HTTP client (no TLS needed — server is on local network)
  reqwless = { version = "0.14", default-features = false }

  cyw43 = { version = "0.7.0", default-features = false, features = [
    "firmware-logs",
  ] }
  cyw43-pio = { version = "0.10.0", default-features = false }

  portable-atomic = { version = "1", features = ["critical-section"] }
  portable-atomic-util = { version = "0.2", default-features = false, features = [
    "alloc",
  ] }
  cortex-m = "0.7"
  cortex-m-rt = "0.7"
  defmt = "1.0"
  defmt-rtt = { version = "1.1", features = ["disable-blocking-mode"] }
  static_cell = "2"

[profile.release]
  opt-level = "s"
  debug = 2
  lto = true
