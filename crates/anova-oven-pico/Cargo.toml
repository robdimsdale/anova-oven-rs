# Standalone workspace — this crate targets thumbv6m-none-eabi (Cortex-M0+)
# and cannot share a workspace with host-target crates due to conflicting
# critical-section features. Build from this directory:
#   cargo build --release
#
# For development with verbose logging from cyw43/embassy-net/reqwless and
# per-event INFO logs from the encoder/heap tasks, add:
#   cargo build --release --features verbose-logs
[workspace]

[package]
  name = "anova-oven-pico"
  version = "0.1.0"
  edition = "2021"

[features]
  default = []
  # Enables defmt on chatty third-party deps and per-event INFO logs in our
  # own code. Off by default so the RTT buffer stays drainable when no probe
  # is attached. Warnings and errors are always emitted unconditionally.
  verbose-logs = [
    "cyw43/defmt",
    "cyw43/firmware-logs",
    "cyw43-pio/defmt",
    "embassy-net/defmt",
    "reqwless/defmt",
  ]

[dependencies]
  # Main branch uses embedded-hal 1.0 but is not yet published to crates.io.
  hd44780-driver = { git = "https://github.com/JohnDoneth/hd44780-driver", branch = "master", features = [
    "async",
  ] }
  embedded-hal = "1"

  anova-oven-api = { path = "../anova-oven-api", default-features = false }
  # Pure-logic core extracted from this crate so it can be host-tested
  # (see crates/anova-oven-pico-core, review §5.1). The `serde` feature
  # opts in to `Serialize` derives on the persist-region data types so
  # the `/health` handler can serve `read_live()` directly with no
  # intermediate response struct (and thus no drift surface).
  anova-oven-pico-core = { path = "../anova-oven-pico-core", features = [
    "defmt",
    "serde",
  ] }
  serde_json = { version = "1.0", default-features = false, features = [
    "alloc",
  ] }

  embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
  ] }
  embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "time-driver",
    "critical-section-impl",
    "rp2040",
  ] }
  embassy-net = { version = "0.9.0", default-features = false, features = [
    "tcp",
    "dhcpv4",
    "dns",
    "medium-ethernet",
    "proto-ipv4",
  ] }
  embassy-futures = "0.1"
  embassy-sync = "0.8"
  embassy-time = "0.5"

  embedded-alloc = "0.7"
  embedded-io-async = "0.7"
  # `serde` enables `Serialize` impls on heapless::String/Vec so the
  # persist snapshot can be served as JSON without copying out to alloc.
  heapless = { version = "0.9", default-features = false, features = ["serde"] }

  # Plain HTTP client (no TLS needed — server is on local network)
  reqwless = { version = "0.14", default-features = false }

  # Inbound HTTP server for the read-only `/health` endpoint. The
  # `json` feature pulls in `serde-json-core` so the handler can return
  # `picoserve::response::Json(HealthResponse)` and have picoserve
  # serialize the typed struct directly to the socket — no alloc on
  # the response path, so `/health` keeps working under heap pressure
  # (which is exactly when it's most useful for debugging).
  picoserve = { version = "0.18", default-features = false, features = [
    "embassy",
    "json",
  ] }

  # NOTE: "firmware-logs" is only enabled via the verbose-logs feature,
  # never by default. Its log_read path calls bp_read with a
  # chip-firmware-provided pointer and asserts `addr % 4 == 0`; when the
  # chip's log ring wraps to an unaligned address the assertion panics
  # the whole MCU (observed in cyw43-0.7.0/src/spi.rs:272). Default
  # builds don't need the chip's internal debug log; dev builds accept
  # the risk in exchange for the extra visibility (and have a probe
  # attached to see the panic anyway).
  cyw43 = { version = "0.7.0", default-features = false }
  cyw43-pio = { version = "0.10.0", default-features = false }

  portable-atomic = { version = "1", features = ["critical-section"] }
  portable-atomic-util = { version = "0.2", default-features = false, features = [
    "alloc",
  ] }
  cortex-m = "0.7"
  cortex-m-rt = "0.7"
  defmt = "1.0"
  defmt-rtt = { version = "1.2", features = ["disable-blocking-mode"] }
  static_cell = "2"

[profile.release]
  opt-level = "s"
  debug = 2
  lto = true
