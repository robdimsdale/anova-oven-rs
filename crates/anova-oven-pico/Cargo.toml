# Standalone workspace — this crate targets thumbv6m-none-eabi (Cortex-M0+)
# and cannot share a workspace with host-target crates due to conflicting
# critical-section features. Build from this directory:
#   cargo build --release
#
# For development with verbose logging from cyw43/embassy-net/reqwless and
# per-event INFO logs from the encoder/heap tasks, add:
#   cargo build --release --features verbose-logs
[workspace]

[package]
  name = "anova-oven-pico"
  version = "0.1.0"
  edition = "2021"

[features]
  # No display by default: the firmware runs headless (defmt logging only)
  # via screen::NullScreen. Opt into a panel with one of the ui-* features.
  default = []

  # --- Display backend selection (at most one; none = headless) ---------
  # The panels can't coexist: they all live in the GP16-GP21 block (the
  # HD44780 uses all six; the Sharp and the OLED share SPI0 on
  # SCK=GP18/MOSI=GP19). Choosing a UI therefore swaps both the peripheral
  # init in main.rs and the render code behind the display task, so it has to
  # be a cfg feature (a src/bin variant can't touch the shared main.rs).
  # `screen.rs` picks `ActiveScreen` from whichever is enabled (or NullScreen
  # when none is) and const-asserts that at most one is. Build:
  #   cargo run --release                              # headless
  #   cargo run --release --features ui-lcd            # character LCD
  #   cargo run --release --features ui-sharp-basic    # Sharp Memory Display
  #   cargo run --release --features ui-oled-basic     # 2.42" 128x64 OLED
  # See docs/pico-displays.md for wiring and per-panel notes.
  ui-lcd = []
  # First graphical layout for the Adafruit 2.7" Sharp Memory Display
  # (LS027B7DH01, 400x240). Add future layouts as sibling `ui-sharp-*`
  # features (see screen.rs / sharp_ui.rs).
  ui-sharp-basic = ["_graphics"]
  # First graphical layout for the Adafruit 2.42" 128x64 OLED module
  # (product 2719, SSD1305/SSD1309). Shares all of the Sharp's layout code —
  # only the driver differs (see screen.rs / oled_ui.rs / oled.rs).
  ui-oled-basic = ["_graphics"]
  # Adafruit revised product 2719 from an SSD1305 to an SSD1309 in September
  # 2023, keeping the pinout and protocol but changing what the controller
  # accepts at init. The board can't be identified over a write-only bus, so
  # the choice is a build flag: add this feature for a board bought since
  # then. Only meaningful alongside `ui-oled-basic`.
  oled-ssd1309 = []

  # Internal (not for direct use): the shared 1-bit graphical stack — the
  # embedded-graphics/u8g2 deps and the `graphics_view` layer that every
  # pixel-addressed panel renders through. Enabled by each `ui-*` feature that
  # needs it, so `cfg(feature = "_graphics")` means "some graphical panel is
  # selected" without enumerating them.
  _graphics = ["dep:embedded-graphics", "dep:u8g2-fonts"]

  # Enables defmt on chatty third-party deps and per-event INFO logs in our
  # own code. Off by default so the RTT buffer stays drainable when no probe
  # is attached. Warnings and errors are always emitted unconditionally.
  verbose-logs = [
    "cyw43/defmt",
    "cyw43/firmware-logs",
    "cyw43-pio/defmt",
    "embassy-net/defmt",
    "reqwless/defmt",
  ]

[dependencies]
  # Main branch uses embedded-hal 1.0 but is not yet published to crates.io.
  hd44780-driver = { git = "https://github.com/JohnDoneth/hd44780-driver", branch = "master", features = [
    "async",
  ] }
  embedded-hal = "1"
  # Graphical backends only (pulled in by `_graphics`). embedded-graphics is a
  # pure no_std graphics lib. Both panels use the blocking `embedded-hal`
  # SpiBus (already a dep) — see sharp.rs for why not async/DMA.
  embedded-graphics = { version = "0.8", optional = true }
  # Bitmap fonts (u8g2 collection) for distance-readable text. Renders straight
  # to an embedded-graphics DrawTarget via its FontRenderer; pulled in only by
  # the `_graphics` feature.
  u8g2-fonts = { version = "0.8", optional = true, default-features = false }

  anova-oven-api = { path = "../anova-oven-api", default-features = false }
  # Pure-logic core extracted from this crate so it can be host-tested
  # (see crates/anova-oven-pico-core, review §5.1). The `serde` feature
  # opts in to `Serialize` derives on the persist-region data types so
  # the `/health` handler can serve `read_live()` directly with no
  # intermediate response struct (and thus no drift surface).
  anova-oven-pico-core = { path = "../anova-oven-pico-core", features = [
    "defmt",
    "serde",
  ] }
  serde_json = { version = "1.0", default-features = false, features = [
    "alloc",
  ] }

  embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
  ] }
  embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "time-driver",
    "critical-section-impl",
    "rp2040",
  ] }
  embassy-net = { version = "0.9.1", default-features = false, features = [
    "tcp",
    "dhcpv4",
    "dns",
    "medium-ethernet",
    "proto-ipv4",
  ] }
  embassy-futures = "0.1"
  embassy-sync = "0.8"
  embassy-time = "0.5"

  embedded-alloc = "0.7"
  embedded-io-async = "0.7"
  # `serde` enables `Serialize` impls on heapless::String/Vec so the
  # persist snapshot can be served as JSON without copying out to alloc.
  heapless = { version = "0.9", default-features = false, features = ["serde"] }

  # Plain HTTP client (no TLS needed — server is on local network)
  reqwless = { version = "0.14", default-features = false }

  # Inbound HTTP server for the read-only `/health` endpoint. The
  # `json` feature pulls in `serde-json-core` so the handler can return
  # `picoserve::response::Json(HealthResponse)` and have picoserve
  # serialize the typed struct directly to the socket — no alloc on
  # the response path, so `/health` keeps working under heap pressure
  # (which is exactly when it's most useful for debugging).
  picoserve = { version = "0.19", default-features = false, features = [
    "embassy",
    "json",
  ] }

  # NOTE: "firmware-logs" is only enabled via the verbose-logs feature,
  # never by default. Its log_read path calls bp_read with a
  # chip-firmware-provided pointer and asserts `addr % 4 == 0`; when the
  # chip's log ring wraps to an unaligned address the assertion panics
  # the whole MCU (observed in cyw43-0.7.0/src/spi.rs:272). Default
  # builds don't need the chip's internal debug log; dev builds accept
  # the risk in exchange for the extra visibility (and have a probe
  # attached to see the panic anyway).
  cyw43 = { version = "0.7.0", default-features = false }
  cyw43-pio = { version = "0.10.0", default-features = false }

  portable-atomic = { version = "1", features = ["critical-section"] }
  portable-atomic-util = { version = "0.2", default-features = false, features = [
    "alloc",
  ] }
  cortex-m = "0.7"
  cortex-m-rt = "0.7"
  defmt = "1.1"
  defmt-rtt = { version = "1.2", features = ["disable-blocking-mode"] }
  static_cell = "2"

[profile.release]
  opt-level = "s"
  debug = 2
  lto = true
