[target.thumbv6m-none-eabi]
  runner = "probe-rs run --chip RP2040 --protocol swd"

[build]
  target = "thumbv6m-none-eabi"

[env]
  DEFMT_LOG = "info"
  # Larger up-channel buffer reduces drop rate when log volume spikes
  # (cyw43 warnings, repeated HTTP timeouts, etc.) and gives more
  # scroll-back when attaching a probe.
  DEFMT_RTT_BUFFER_SIZE = "4096"
