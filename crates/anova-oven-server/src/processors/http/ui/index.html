<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anova Oven</title>
  <link rel="stylesheet" href="/ui/style.css">
  <script src="/ui/common.js"></script>
  <script src="/ui/steps.js"></script>
</head>
<body>
  <header>
    <span class="brand">Anova Oven</span>
    <nav>
      <a href="/" aria-current="page">Status</a>
      <a href="/recipes">Recipes</a>
    </nav>
    <div class="unit-switch" role="group" aria-label="Temperature unit">
      <button type="button" data-unit="F">°F</button>
      <button type="button" data-unit="C">°C</button>
    </div>
  </header>
  <main>
    <div id="message" class="message"></div>

    <section class="card">
      <div class="row spread">
        <span id="phase" class="badge">—</span>
        <span id="link" class="badge">—</span>
      </div>
      <div class="row" style="margin-top: 12px; align-items: baseline;">
        <span id="temp" class="big">—</span>
        <span id="target" class="muted"></span>
      </div>
      <dl class="stats">
        <div><dt>Timer</dt><dd id="timer">—</dd></div>
        <div><dt>Steam</dt><dd id="steam">—</dd></div>
        <div><dt>Probe</dt><dd id="probe">—</dd></div>
        <div><dt>Door</dt><dd id="door">—</dd></div>
        <div><dt>Water tank</dt><dd id="water">—</dd></div>
        <div><dt>Light</dt><dd id="lamp-state">—</dd></div>
      </dl>
    </section>

    <section id="cook" class="card" hidden>
      <h2 id="cook-title"></h2>
      <p id="cook-stage" class="muted" style="margin: 0;"></p>
      <ol id="cook-steps" class="cook-steps" hidden></ol>
      <p id="cook-prompt" style="margin: 10px 0 0;" hidden></p>
      <div class="row" style="margin-top: 14px;">
        <button id="next-stage" class="primary" hidden>Start next step</button>
        <button id="save-recipe" hidden>Save as recipe</button>
        <button id="stop" class="danger">Stop cook</button>
      </div>
    </section>

    <section id="manual" hidden>
      <div class="card">
        <h2>Manual cook</h2>
        <label>Title
          <input id="manual-title" placeholder="Manual cook" maxlength="200">
        </label>
      </div>
      <div id="manual-steps"></div>
      <div class="row" style="margin-bottom: 16px;">
        <button type="button" id="manual-add">Add step</button>
        <button type="button" id="manual-start" class="primary">Start cook</button>
      </div>
    </section>

    <section class="card">
      <h2>Controls</h2>
      <div class="row">
        <button id="lamp-on">Light on</button>
        <button id="lamp-off">Light off</button>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const message = $("message");
    let status = null;

    function render() {
      if (!status) return;
      const s = status;

      const phase = s.mode === "idle" ? "Idle"
        : s.timer_mode === "idle" && s.timer_current_secs === 0 ? "Preheating" : "Cooking";
      $("phase").textContent = phase;
      $("phase").className = "badge" + (s.mode === "idle" ? "" : " ok");

      const up = s.upstream;
      if (!up || up.connected) {
        $("link").textContent = "Oven connected";
        $("link").className = "badge ok";
      } else {
        $("link").textContent = `Oven disconnected ${formatDuration(up.disconnected_secs)}`;
        $("link").className = "badge danger";
      }

      const current = s.temperature_bulbs_mode === "wet" ? s.wet_bulb_temperature_c : s.temperature_c;
      $("temp").textContent = formatTemp(current);
      $("target").textContent = s.target_temperature_c != null && s.mode !== "idle"
        ? `target ${formatTemp(s.target_temperature_c)}` : "";
      $("timer").textContent = s.timer_mode === "idle" && s.timer_total_secs === 0
        ? "—" : `${formatDuration(s.timer_current_secs)} / ${formatDuration(s.timer_total_secs)}`;
      $("steam").textContent = s.steam_target_pct != null && s.mode !== "idle"
        ? `${Math.round(s.steam_pct)}% → ${Math.round(s.steam_target_pct)}%`
        : `${Math.round(s.steam_pct)}%`;
      $("probe").textContent = formatTemp(s.probe_temperature_c);
      $("door").textContent = s.door_open ? "Open" : "Closed";
      $("water").textContent = s.water_tank_empty ? "Empty" : "OK";
      $("lamp-state").textContent = s.lamp_on ? "On" : "Off";
      $("lamp-on").disabled = s.lamp_on;
      $("lamp-off").disabled = !s.lamp_on;

      const progress = s.cook_progress;
      $("cook").hidden = s.mode === "idle";
      // A manual cook can be set up whenever nothing is cooking. Only shown
      // or hidden here, so polling never disturbs what's being typed.
      $("manual").hidden = s.mode !== "idle";
      if (progress) {
        $("cook-title").textContent = progress.recipe_title;
        const step = renderCookSteps(progress);
        $("cook-stage").textContent = step
          ? `Step ${step.number} of ${step.count}: ${step.title}`
          : `Step ${progress.current_step_index + 1} of ${progress.step_count}: ${stageDescription(progress)}`;
        $("next-stage").hidden = !progress.next_stage_ready;
        // The step list shows the note where it waits.
        $("cook-prompt").textContent = progress.next_stage_prompt || "";
        $("cook-prompt").hidden = !!step || !progress.next_stage_prompt;
        $("save-recipe").hidden = !cookCanSave;
      } else {
        $("cook-title").textContent = "Cooking";
        $("cook-stage").textContent = "";
        $("cook-steps").hidden = true;
        $("next-stage").hidden = true;
        $("cook-prompt").hidden = true;
        $("save-recipe").hidden = !cookCanSave;
      }
    }

    // The whole cook, as the editor's steps (a preheat and the cook after it
    // are one step, though the oven runs them as two stages): done, now and
    // to come, with each place it waits for you and its note between them.
    // Returns the current step, or null if the stages aren't known.
    function renderCookSteps(progress) {
      const list = $("cook-steps");
      if (!cookStages || cookStages.length !== progress.total_stage_count) {
        list.hidden = true;
        return null;
      }
      let at = 0;
      const steps = toSteps(cookStages).map((step) => {
        const first = at;
        at += (step.preheat ? 1 : 0) + (step.cook ? 1 : 0);
        return { step, first, last: at - 1 };
      });
      const active = progress.current_stage_index;
      // The stage that waits to be started, while the oven waits.
      const waiting = progress.next_stage_ready ? active + 1 : -1;
      let current = null;
      list.innerHTML = steps.map(({ step, first, last }, n) => {
        const holdsBefore = n > 0 && !endingOf(steps[n - 1].step);
        const before = n > 0 && (holdsBefore || firstStage(step).user_action_required)
          ? waitHtml(firstStage(step), waiting === first, "li") : "";
        const state = last < active ? "done" : first <= active ? "now" : "next";
        const title = mainStage(step).title || `Step ${n + 1}`;
        if (state === "now") current = { number: n + 1, count: steps.length, title };
        // A preheat that waits for you before its cook.
        const inside = step.preheat && step.cook && step.cook.user_action_required
          ? waitHtml(step.cook, waiting === last, "div") : "";
        const doing = state === "now" ? `<span class="badge ok">${stepDoing(step, active - first, waiting >= 0)}</span>` : "";
        return `${before}
          <li class="cook-step ${state}"${state === "now" ? ' aria-current="step"' : ""}>
            <span class="stage-number">${state === "done" ? "✓" : n + 1}</span>
            <div>
              <div class="row" style="gap: 8px;"><span class="cook-step-title">${escapeHtml(title)}</span>${doing}</div>
              <div class="muted small">${stepDetails(step, n === steps.length - 1)}</div>
              ${inside}
            </div>
          </li>`;
      }).join("");
      list.hidden = false;
      return current;
    }

    function waitHtml(stage, now, tag) {
      const note = stage.prompt ? `: ${escapeHtml(stage.prompt)}` : "";
      return `<${tag} class="cook-wait${now ? " now" : ""}">${now ? "Waiting for you" : "Waits for you"}${note}</${tag}>`;
    }

    // What the current step is doing; `stage` is which of its stages runs.
    function stepDoing(step, stage, waiting) {
      if (step.preheat && stage === 0) return waiting ? "Preheated" : "Preheating";
      if (!step.cook || endingOf(step)) return "Cooking";
      return "Holding until you say";
    }

    function stepDetails(step, last) {
      const s = mainStage(step);
      const parts = [formatTemp(s.temperature_c) + (s.temperature_bulbs_mode === "wet" ? " sous vide" : "")];
      if (s.steam_pct > 0) parts.push(`${Math.round(s.steam_pct)}% steam`);
      if (!step.cook) parts.push("until preheated");
      else {
        if (step.preheat) parts.push("preheat first");
        const ends = endsOf(step.cook);
        if (ends === "timer") parts.push(minutes(step.cook.duration_secs));
        else if (ends === "probe") parts.push(`probe to ${formatTemp(step.cook.probe_target_c)}`);
        else parts.push("until you say");
        if (last && step.cook.turn_off_at_end) parts.push("then off");
      }
      return parts.join(" · ");
    }

    function minutes(secs) {
      return secs % 60 || secs >= 3600 ? formatDuration(secs) : `${secs / 60} min`;
    }

    // The running cook's stages, for describing the current one in the
    // unit on screen. (The server's own description is in Celsius.)
    let cookStages = null;
    // Whether the running cook isn't a saved recipe and can be saved as one.
    let cookCanSave = false;
    let cookTitle = null;

    function stageDescription(progress) {
      const stage = cookStages && cookStages[progress.current_stage_index];
      if (!stage) return progress.current_stage_description;
      const name = stage.title || (stage.kind === "preheat" ? "Preheat" : "Cook");
      const wet = stage.temperature_bulbs_mode === "wet" ? " sous vide" : "";
      return `${name} · ${formatTemp(stage.temperature_c)}${wet}`;
    }

    async function poll() {
      try {
        status = await api("GET", "/status");
        if (status.mode !== "idle") {
          try {
            const cook = await api("GET", "/current-cook");
            cookStages = cook ? cook.stages : null;
            cookCanSave = !!(cook && cook.can_save);
            cookTitle = cook ? cook.recipe_title : null;
          } catch (_) {
            cookStages = null;
            cookCanSave = false;
          }
        } else {
          cookStages = null;
          cookCanSave = false;
        }
        if (message.dataset.fromPoll) {
          clearMessage(message);
          delete message.dataset.fromPoll;
        }
        render();
      } catch (e) {
        showMessage(message, e.message);
        message.dataset.fromPoll = "1";
      }
    }

    async function act(path, body) {
      clearMessage(message);
      try {
        await api("POST", path, body);
        setTimeout(poll, 800);
      } catch (e) {
        showMessage(message, e.message);
      }
    }

    const manual = createStepEditor($("manual-steps"), {
      name: "manual",
      onChange: (ok) => { $("manual-start").disabled = !ok; },
    });
    manual.reset();
    $("manual-add").onclick = () => manual.addStep();
    $("manual-start").onclick = async () => {
      const title = $("manual-title").value.trim();
      if (!confirm(`Start ${title ? `“${title}”` : "this manual cook"} now?`)) return;
      clearMessage(message);
      try {
        await api("POST", "/start", { title: title || undefined, stages: manual.stages() });
        showMessage(message, `Started ${title || "manual cook"}`, "ok");
        $("manual-title").value = "";
        manual.reset();
        setTimeout(poll, 800);
      } catch (e) {
        showMessage(message, e.message);
      }
    };

    $("lamp-on").onclick = () => act("/lamp", { on: true });
    $("lamp-off").onclick = () => act("/lamp", { on: false });
    $("next-stage").onclick = () => act("/next-stage");
    $("save-recipe").onclick = async () => {
      const suggested = cookTitle && cookTitle !== "[manual]" ? cookTitle : "";
      const title = prompt("Save this cook as a recipe called:", suggested);
      if (title === null) return;
      if (!title.trim()) {
        showMessage(message, "Give the recipe a title");
        return;
      }
      clearMessage(message);
      try {
        const recipe = await api("POST", "/current-cook/save", { title });
        cookCanSave = false;
        render();
        message.className = "message ok";
        message.innerHTML = `Saved <a href="/recipes/${encodeURIComponent(recipe.id)}">${escapeHtml(recipe.title)}</a>`;
        setTimeout(poll, 800);
      } catch (e) {
        showMessage(message, e.message);
      }
    };
    $("stop").onclick = () => {
      if (confirm("Stop the cook?")) act("/stop");
    };

    initUnitSwitch(() => { render(); manual.render(); });
    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
