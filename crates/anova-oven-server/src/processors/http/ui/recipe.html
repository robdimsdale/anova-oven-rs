<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe · Anova Oven</title>
  <base href="/">
  <link rel="stylesheet" href="ui/style.css">
  <script src="ui/common.js"></script>
  <script src="ui/steps.js"></script>
</head>
<body>
  <header>
    <span class="brand">Anova Oven</span>
    <nav>
      <a href="./">Status</a>
      <a href="recipes" aria-current="page">Recipes</a>
    </nav>
    <div class="unit-switch" role="group" aria-label="Temperature unit">
      <button type="button" data-unit="F">°F</button>
      <button type="button" data-unit="C">°C</button>
    </div>
  </header>
  <main>
    <div class="row spread" style="margin-bottom: 16px;">
      <h1 id="heading" style="margin: 0;">Recipe</h1>
      <div class="row">
        <button type="button" id="copy" hidden>Copy</button>
        <button type="button" id="start-in" hidden>Start in…</button>
        <button type="button" id="start-at" hidden>Start at…</button>
        <button type="button" id="start" class="primary" hidden>Start</button>
      </div>
    </div>
    <div id="message" class="message"></div>

    <form id="form" hidden novalidate>
      <section class="card">
        <label>Title
          <input id="title" maxlength="200">
        </label>
        <p id="source" class="muted small" style="margin: 10px 0 0;"></p>
        <ul id="title-problems" class="problems"></ul>
      </section>

      <div id="steps"></div>

      <div class="row" style="margin-bottom: 24px;">
        <button type="button" id="add-step">Add step</button>
      </div>

      <div class="row spread">
        <div class="row">
          <button type="submit" id="save" class="primary">Save</button>
          <a class="button" href="recipes">Cancel</a>
        </div>
        <button type="button" id="delete" class="danger" hidden>Delete recipe</button>
      </div>
    </form>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const message = $("message");
    // The path after the base is "recipes/<id>". Behind a reverse proxy,
    // the base holds the prefix, so the prefix may contain anything.
    const local = location.pathname.slice(new URL(document.baseURI).pathname.length);
    const segment = decodeURIComponent(local.split("/")[1] || "new");
    const isNew = segment === "new";
    let recipe = null;

    // Save waits for a title and steps the oven could run.
    let stagesOk = false;
    const editor = createStepEditor($("steps"), {
      name: "recipe",
      onChange: (ok) => { stagesOk = ok; validate(); },
    });

    // What was last loaded or saved, to tell unsaved edits apart. Start
    // runs the saved recipe, so it waits for them to be saved.
    let saved = null;
    const snapshot = () => JSON.stringify({ title: $("title").value, stages: editor.stages() });

    function validate() {
      const titled = $("title").value.trim() !== "";
      $("title-problems").innerHTML = titled ? "" : "<li>Give the recipe a title</li>";
      $("save").disabled = !(titled && stagesOk);
      const dirty = saved !== null && snapshot() !== saved;
      $("start").disabled = dirty;
      $("start").textContent = dirty ? "Save first" : "Start";
      $("start-in").disabled = dirty;
      $("start-at").disabled = dirty;
      $("copy").disabled = dirty;
    }

    function markSaved() {
      saved = snapshot();
      validate();
    }

    $("title").addEventListener("input", validate);
    $("add-step").onclick = () => editor.addStep();

    $("form").onsubmit = async (event) => {
      event.preventDefault();
      if ($("save").disabled) return;
      clearMessage(message);
      const body = { title: $("title").value, stages: editor.stages() };
      try {
        if (isNew) {
          const created = await api("POST", "/recipes", body);
          location.href = `recipes/${encodeURIComponent(created.id)}?saved=1`;
        } else {
          recipe = await api("PATCH", `/recipes/${encodeURIComponent(recipe.id)}`, body);
          editor.setStages(recipe.stages);
          markSaved();
          showMessage(message, "Saved", "ok");
        }
      } catch (e) {
        showMessage(message, e.message);
      }
    };

    $("start").onclick = async () => {
      if (!confirm(`Start “${recipe.title}” now?`)) return;
      clearMessage(message);
      try {
        await api("POST", "/start", { recipe_id: recipe.id });
        location.href = "./";
      } catch (e) {
        showMessage(message, e.message);
      }
    };

    const later = (kind) => async () => {
      clearMessage(message);
      try {
        const scheduled = await startLater(kind, recipe.title, { recipe_id: recipe.id });
        if (scheduled) location.href = "./";
      } catch (e) {
        showMessage(message, e.message);
      }
    };
    $("start-in").onclick = later("in");
    $("start-at").onclick = later("at");

    // Save a copy of the saved recipe and open it, to rename and change.
    // Its stages get fresh IDs, so the two recipes don't share any.
    $("copy").onclick = async () => {
      clearMessage(message);
      const stages = recipe.stages.map(({ id, ...stage }) => stage);
      try {
        const created = await api("POST", "/recipes", { title: `${recipe.title} (copy)`, stages });
        location.href = `recipes/${encodeURIComponent(created.id)}?copied=1`;
      } catch (e) {
        showMessage(message, e.message);
      }
    };

    $("delete").onclick = async () => {
      if (!confirm(`Delete “${recipe.title}”? This can't be undone.`)) return;
      try {
        await api("DELETE", `/recipes/${encodeURIComponent(recipe.id)}`);
        location.href = "recipes";
      } catch (e) {
        showMessage(message, e.message);
      }
    };

    async function load() {
      try {
        recipe = isNew
          ? { title: "", stages: [], source: "own" }
          : await api("GET", `/recipes/${encodeURIComponent(segment)}`);
      } catch (e) {
        showMessage(message, e.message);
        return;
      }
      $("heading").textContent = isNew ? "New recipe" : recipe.title;
      document.title = `${isNew ? "New recipe" : recipe.title} · Anova Oven`;
      $("title").value = recipe.title;
      $("source").textContent = recipe.source === "bookmarked"
        ? "Bookmarked from Anova. Changes here only affect this copy" : "";
      $("delete").hidden = isNew;
      $("start").hidden = isNew;
      $("start-in").hidden = isNew;
      $("start-at").hidden = isNew;
      $("copy").hidden = isNew;
      $("form").hidden = false;
      const params = new URLSearchParams(location.search);
      if (params.has("saved")) showMessage(message, "Saved", "ok");
      if (params.has("copied")) {
        showMessage(message, "Copied. Rename it and make your changes", "ok");
        $("title").select();
      }
      if (isNew) editor.reset();
      else {
        editor.setStages(recipe.stages);
        markSaved();
      }
    }

    initUnitSwitch(() => { if (recipe) editor.render(); });
    load();
  </script>
</body>
</html>
