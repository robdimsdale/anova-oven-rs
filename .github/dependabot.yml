version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # The pico crate declares its own [workspace] so it has a separate
  # Cargo.lock and is not reachable from the root manifest. Dependabot
  # needs an explicit entry to scan it.
  - package-ecosystem: cargo
    directory: /crates/anova-oven-pico
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
