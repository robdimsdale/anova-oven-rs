name: Create Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install nightly toolchain for pico
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: thumbv6m-none-eabi
          components: rustfmt, clippy
          # Leave the repo root on stable: the pico crate selects nightly via
          # its own rust-toolchain.toml.
          override: false

      - name: Build and test
        run: ./scripts/build-and-test.sh
